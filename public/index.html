<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{appName}}</title>
  <meta name="theme-color" content="#04080a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="{{appName}}">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="title">{{appNameUpper}}</h1>
      <div class="sub">HEADING CLASSIFIER · v3.7</div>
    </header>

    <section class="readout">
      <div class="status" id="status"><span id="status-text">Scanning</span><span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></div>

      <div class="dial">
        <div class="sweep" aria-hidden="true"></div>
        <svg viewBox="0 0 320 190" class="gauge" aria-hidden="true">
          <defs>
            <linearGradient id="arcGrad" x1="0" x2="1" y1="0" y2="0">
              <stop offset="0" stop-color="#2de2e6"/>
              <stop offset="0.5" stop-color="#3dff9a"/>
              <stop offset="1" stop-color="#ff4fd8"/>
            </linearGradient>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="2.4" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M 20 170 A 140 140 0 0 1 300 170" fill="none" stroke="#0f2a22" stroke-width="18" stroke-linecap="round"/>
          <path d="M 20 170 A 140 140 0 0 1 300 170" fill="none" stroke="url(#arcGrad)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
          <g id="ticks" stroke="#3dff9a" stroke-linecap="round"></g>
          <text x="22" y="188" class="lbl" text-anchor="start">{{labelNotRadUpper}}</text>
          <text x="298" y="188" class="lbl" text-anchor="end">{{labelRadUpper}}</text>
          <g id="needle" filter="url(#glow)">
            <line x1="160" y1="182" x2="160" y2="44" stroke="#eafff4" stroke-width="3" stroke-linecap="round"/>
            <circle cx="160" cy="44" r="3.2" fill="#eafff4"/>
          </g>
          <circle cx="160" cy="170" r="11" fill="#0b1a15" stroke="#3dff9a" stroke-width="2"/>
          <circle cx="160" cy="170" r="3.5" fill="#3dff9a"/>
        </svg>
      </div>

      <div class="result" id="result" aria-live="polite"></div>
    </section>

    <button class="scan" id="scan" type="button">
      <span class="scan-label">SCAN</span>
    </button>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
